<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101014">
<title>HAZARD 7007</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
<div class="logo">HAZARD <span>7007</span></div>
<div class="status">
<span class="status-dot"></span>
SYSTEM ONLINE
</div>
</header>

<main class="container">

<section class="display">
<div class="display-label">EMERGENCY CONTROL SYSTEM</div>
<h1 id="mode">STANDBY</h1>
<p id="status">SYSTEM READY</p>
</section>

<section class="lightbar">
<div class="light red" id="redLight"></div>
<div class="light blue" id="blueLight"></div>
</section>

<section class="controls">
<button id="siren" class="control red-btn">SIREN</button>
<button id="man" class="control">MAN</button>
<button id="horn" class="control">HORN</button>
<button id="airhorn" class="control">AIR HORN</button>
<button id="lights" class="control blue-btn">LIGHTBAR</button>
<button id="radio" class="control">RADIO</button>
</section>

<section class="radio-panel">
<h2>RADIO COMMUNICATION</h2>
<button id="ptt" class="ptt">HOLD TO TALK</button>
<p id="radioStatus">RADIO STANDBY</p>
</section>

<section class="volume-panel">
<label for="volume">MASTER VOLUME</label>
<input id="volume" type="range" min="0" max="100" value="45">
</section>

</main>

<footer>HAZARD 7007 © 2026</footer>

<script src="script.js"></script>
</body>
</html>
